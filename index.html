<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yerevan Hood — Kond Street Brawler</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #120d1d;
      overflow: hidden;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas {
      width: min(100vw, calc(100vh * 16 / 9));
      height: auto;
      display: block;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.8);
    }
    #loading {
      position: absolute;
      color: #c9a0ff;
      letter-spacing: 2px;
      font-size: 14px;
    }
    #loading.error {
      max-width: 80vw;
      color: #ff8a7a;
      letter-spacing: 0;
      line-height: 1.5;
    }
  </style>
  <script type="importmap">
    { "imports": { "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.mjs" } }
  </script>
  <script>
    function showFatal(title, detail) {
      const div = document.createElement("div");
      div.style.cssText = "position:fixed;top:10px;left:10px;right:10px;background:rgba(180,20,20,.92);color:#fff;" +
        "padding:16px;font:13px monospace;z-index:999999;border-radius:8px;white-space:pre-wrap";
      div.innerText = title + "\n" + detail;
      document.body.appendChild(div);
    }
    window.onerror = function (msg, url, line, col, err) {
      console.error(msg, url, line, col, err);
      showFatal("Runtime Error: " + msg, "Location: " + url + ":" + line + ":" + col + (err?.stack ? "\n\nStack:\n" + err.stack : ""));
    };
    window.addEventListener("unhandledrejection", function (e) {
      console.error("Unhandled Rejection:", e.reason);
      showFatal("Startup/Promise Error:", e.reason?.stack || e.reason || "Unknown error");
    });
  </script>
</head>
<body>
  <div id="loading">LOADING YEREVAN HOOD…</div>
  <div id="game"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
